<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CatShu Runner — Playable</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <div class="world"></div>
  <div class="road"></div>
  <div class="speed"></div>
  <div class="hud">
    <button id="pause">Ⅱ</button>
    <div><small>SCORE</small><b id="score">0</b></div>
    <div><small>DISTANCE</small><b id="distance">0m</b></div>
    <div><small>COMBO</small><b id="combo">x1</b></div>
  </div>

  <div id="objects"></div>

  <div id="player">
    <div class="shadow"></div>
    <img id="runner" src="assets/run_0.png">
  </div>

  <div class="touch">
    <button data-a="left">‹</button>
    <button data-a="jump">↑</button>
    <button data-a="slide">↓</button>
    <button data-a="right">›</button>
  </div>

  <section id="start" class="overlay">
    <div class="logo">♛ CATSHU <span>RUNNER</span></div>
    <p>RUN THROUGH THE CITY</p>
    <button class="gold" id="startBtn">START RUN</button>
    <button class="dark" id="charsBtn">CHARACTER</button>
    <small>← → lane &nbsp; • &nbsp; ↑ jump &nbsp; • &nbsp; ↓ slide</small>
  </section>

  <section id="pause" class="overlay hide">
    <div class="card"><h1>PAUSED</h1><button class="gold" id="resume">RESUME</button><button class="dark" id="restart">RESTART</button></div>
  </section>

  <section id="over" class="overlay hide">
    <div class="card"><p>RUN COMPLETE</p><h1 id="finalScore">0</h1>
      <div class="results"><span>DISTANCE <b id="finalDistance">0m</b></span><span>STARS <b id="finalStars">0</b></span></div>
      <button class="gold" id="again">RUN AGAIN</button><button class="dark" id="home">HOME</button>
    </div>
  </section>

  <section id="characters" class="overlay hide">
    <div class="card chars"><button class="x" id="closeChars">×</button><h2>CATSHU</h2>
      <div class="grid" id="grid"></div><button class="gold" id="useChar">USE CHARACTER</button>
    </div>
  </section>
</div>
<script src="main.js"></script>
</body>
</html>
