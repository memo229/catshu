<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CatShu City Runner — Visual Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <div class="scene"></div>
  <div class="speed-lines"></div>
  <div class="petals"></div>

  <div class="hud">
    <button id="pause">Ⅱ</button>
    <div class="hud-box"><small>SCORE</small><b id="score">0</b></div>
    <div class="hud-box"><small>DISTANCE</small><b><span id="distance">0</span>m</b></div>
    <div class="hud-box"><small>COMBO</small><b id="combo">x1</b></div>
  </div>

  <div class="lane-glow l1"></div><div class="lane-glow l2"></div>
  <div class="runner-wrap" id="runner">
    <img src="assets/runner.png" alt="CatShu runner">
    <div class="runner-shadow"></div>
  </div>

  <div class="collectibles" id="collectibles"></div>
  <div class="obstacles" id="obstacles"></div>

  <div class="controls">
    <button data-act="left">‹</button>
    <button data-act="jump">↑<span>JUMP</span></button>
    <button data-act="slide">↓<span>SLIDE</span></button>
    <button data-act="right">›</button>
  </div>

  <div class="intro" id="intro">
    <div class="logo">♛ CATSHU <span>RUNNER</span></div>
    <p>RUN THROUGH THE CITY</p>
    <button id="start">START RUN</button>
    <div class="hint">← → change lane &nbsp; • &nbsp; ↑ jump &nbsp; • &nbsp; ↓ slide</div>
  </div>

  <div class="pause hidden" id="paused">
    <h2>PAUSED</h2><button id="resume">RESUME</button>
  </div>
</div>
<script src="main.js"></script>
</body>
</html>
