<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>CatShu Runner</title><link rel="stylesheet" href="style.css"></head><body><div class="top"><b>🐱 CAT<span>SHU</span></b><small>SEASON 01 • TOP 1,100 QUALIFY</small><button id="sound">🔊</button></div><main><section id="home" class="screen on"><div class="card"><i>ENDLESS RUNNER</i><h1>CATSHU<br><em>RUNNER</em></h1><p>Run through the moonlit kingdom. Switch lanes, jump, slide and survive as the speed keeps rising.</p><div id="chars"></div><button id="start">START RUN ▶</button><div class="keys">← → LANE &nbsp; • &nbsp; ↑ JUMP &nbsp; • &nbsp; ↓ SLIDE</div></div></section><section id="game" class="screen"><canvas id="c"></canvas><div class="hud"><label>SCORE<strong id="sc">0</strong></label><label>DISTANCE<strong id="dist">0m</strong></label><label>COMBO<strong id="co">x1</strong></label><label class="best">BEST<strong id="be">0</strong></label></div><button id="pause">Ⅱ</button><div id="power">✦ <span>READY</span></div></section><section id="over" class="screen"><div class="result"><i>RUN COMPLETE</i><h2>LEGENDARY RUN</h2><div class="grid"><label>SCORE<b id="fsc">0</b></label><label>DISTANCE<b id="fd">0m</b></label><label>STARS<b id="fst">0</b></label><label>BEST<b id="fbe">0</b></label></div><p id="msg"></p><button id="again">RUN AGAIN ↻</button><button id="homeBtn">BACK TO HOME</button></div></section></main><footer>CATSHU • PLAY • COMPETE • EARN</footer><script src="main.js"></script></body></html>
