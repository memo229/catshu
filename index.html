<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CatShu 3D Runner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game"></div>

<div id="hud">
  <div class="brand">♛ CATSHU <span>RUNNER</span></div>
  <div class="stats">
    <div><small>SCORE</small><b id="score">0</b></div>
    <div><small>DISTANCE</small><b id="distance">0m</b></div>
    <button id="pause">Ⅱ</button>
  </div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <div class="eyebrow">CATSHU CITY • 3D PROTOTYPE</div>
    <h1>RUN<br><span>THE CITY</span></h1>
    <p>A third-person endless runner prototype. Three lanes, real 3D camera, city blocks and a rear-view CatShu runner.</p>
    <button id="start">▶ START RUN</button>
    <div class="help">← → CHANGE LANE &nbsp; • &nbsp; ↑ JUMP &nbsp; • &nbsp; ↓ SLIDE</div>
  </div>
</div>

<div id="gameover" class="overlay hidden">
  <div class="card">
    <div class="eyebrow">RUN ENDED</div>
    <h2 id="finalScore">0</h2>
    <p><span id="finalDistance">0</span> meters through CatShu City</p>
    <button id="again">↻ RUN AGAIN</button>
    <button class="secondary" id="home">⌂ MAIN MENU</button>
  </div>
</div>

<div id="mobile">
  <button data-a="left">‹</button>
  <button data-a="jump">↑</button>
  <button data-a="right">›</button>
  <button data-a="slide">↓</button>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
