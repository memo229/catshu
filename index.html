<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CatShu Runner — Reference Demo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>

  <div class="hud">
    <button id="pause" class="round">Ⅱ</button>
    <div class="coinBox"><span class="paw">🐾</span><b id="coins">0</b><span>/20</span></div>
    <div class="score"><small>SCORE</small><b id="score">000000</b><span id="mult">x1</span></div>
  </div>

  <div id="start" class="overlay">
    <div class="card">
      <div class="brand">CATSHU</div>
      <h1>RUN THE KINGDOM</h1>
      <p>Swipe / Arrow keys to change lanes.<br>Swipe up / ↑ to jump. Swipe down / ↓ to slide.</p>
      <button id="play">PLAY</button>
    </div>
  </div>

  <div id="gameover" class="overlay hidden">
    <div class="card">
      <div class="brand">CATSHU</div>
      <h1>RUN ENDED</h1>
      <p>Score <b id="finalScore">0</b> · Coins <b id="finalCoins">0</b></p>
      <button id="again">RUN AGAIN</button>
    </div>
  </div>

  <div id="touch">
    <button data-act="left">◀</button>
    <button data-act="jump">▲</button>
    <button data-act="slide">▼</button>
    <button data-act="right">▶</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
